<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MADAR Minerals Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* MADAR Minerals: large blind test scoreboard. Header (brand, link back to the console, language), verdict strip
   (hits vs chance, lift, p-value), how-to-read note, grid of site cards (thumbnail with targets + known deposit,
   hit/miss, distance, chance), honest limits. Same dark copper console look as the minerals console. */
:root{
  --void:#0b0805; --glass:rgba(40,28,16,.66); --glass2:rgba(24,17,10,.88); --edge:rgba(255,178,90,.24); --edge2:rgba(255,178,90,.62);
  --ink:#fbf1e3; --mute:#bfa587; --dim:#7a644c; --gold:#ffb85c; --copper:#ff8a3d; --green:#7dffb0; --cyan:#62e3ff; --red:#ff5a4a;
  --tech:"Chakra Petch","Readex Pro",system-ui,sans-serif; --ar:"Readex Pro",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark; background:var(--void);
}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#3a2410 0%,#140d07 55%,#0b0805 100%) fixed;color:var(--ink);font-family:var(--tech);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:10px 16px 40px}
[dir="rtl"] .wrap{font-family:var(--ar)}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:10px;box-shadow:inset 0 0 24px rgba(255,184,92,.05)}
.num{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:600 10.5px var(--tech);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
[dir="rtl"] .lbl{letter-spacing:0;font-family:var(--ar);font-size:12px}
.hd{display:flex;align-items:center;gap:12px;padding:8px 12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;direction:ltr}
.logo b{font:700 16px var(--tech);letter-spacing:.06em}
.logo small{display:block;font:500 10px var(--mono);color:var(--mute);letter-spacing:.08em}
.sp{flex:1}
.back{border:1px solid var(--edge2);border-radius:8px;padding:7px 11px;font-weight:600;font-size:12.5px;color:var(--gold);text-decoration:none;white-space:nowrap}
.langs{display:inline-flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden;direction:ltr}
.langs button{border:0;background:none;padding:7px 10px;font:600 12px var(--tech);color:var(--mute);cursor:pointer;min-height:34px}
.langs button[aria-pressed="true"]{background:rgba(255,184,92,.16);color:var(--ink)}
.demo{font:700 11px var(--mono);color:#1a1000;background:var(--gold);border-radius:5px;padding:3px 7px;letter-spacing:.08em}
h1{font-size:clamp(22px,4vw,32px);margin:18px 0 4px;font-weight:700}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px;line-height:1.6}
.verdict{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.k{padding:12px}
.k b{display:block;font:700 30px var(--mono);direction:ltr;text-align:start;line-height:1.1}
.k span{font-size:12.5px;color:var(--mute)}
.k.main b{color:var(--gold)}
.read{margin-top:8px;padding:12px 14px;font-size:14px;line-height:1.75}
.read b{color:var(--gold)}
.split{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px}
.card{overflow:hidden}
.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#140d07}
.cb{padding:10px 11px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cb h3{margin:0;font-size:14.5px;font-weight:600;direction:ltr;text-align:start}
.cb p{margin:4px 0 0;font-size:12.5px;color:var(--mute)}
.badge{flex:none;font:700 11.5px var(--tech);border-radius:6px;padding:3px 7px}
.badge.ok{background:rgba(125,255,176,.15);color:var(--green);border:1px solid rgba(125,255,176,.5)}
.badge.no{background:rgba(255,90,74,.13);color:var(--red);border:1px solid rgba(255,90,74,.5)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.facts div{border:1px solid var(--edge);border-radius:6px;padding:5px 6px}
.facts b{display:block;font:600 13px var(--mono);direction:ltr;text-align:start}
.facts span{font-size:10.5px;color:var(--mute)}
.src{font:500 10.5px var(--mono);color:var(--dim);direction:ltr;margin-top:6px;text-align:start}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
.lim{margin-top:14px;padding:12px 14px;font-size:13.5px;line-height:1.7;color:var(--mute)}
.lim ul{margin:6px 0 0;padding-inline-start:18px}
@media (max-width:760px){.verdict{grid-template-columns:repeat(2,1fr)}.k b{font-size:24px}}
</style>
</head>

    sub:(n,b)=>`${n} real sites in Morocco and Mauritania. For each, a box of about ${b}×${b} km placed with a random offset; MADAR does not know where the deposit is. We measure: does one of its top 10 targets fall within ${DATA.hit_km} km of the known site?`,
    k:["MADAR hits","Expected by chance","MADAR beats chance ×","Probability it is luck"],
    read:s=>`<b>How to read:</b> with 10 targets placed at random in each box, we would hit on average <b class="num">${s.expected_by_chance}</b> of ${s.n} sites. MADAR hits <b class="num">${s.hits}</b>. ${s.p_value<0.05?`The probability of this result by luck alone is only <b class="num">${(s.p_value*100).toFixed(2)}%</b>: MADAR <b>sees a real signal</b>.`:`The probability of this result by luck is <b class="num">${(s.p_value*100).toFixed(1)}%</b>: <b>not enough</b> to say MADAR beats chance.`}
      <div class="split"><span>Worked mines: <span class="num">${s.hits_mines}/${s.n_mines}</span></span><span>Unmined occurrences (strongest proof): <span class="num">${s.hits_occ}/${s.n_occ}</span></span><span>Median rank of the score around the site: above <span class="num">${s.median_percentile}%</span> of the area</span></div>`,
    hit:"✓ Hit",miss:"✗ Miss",dist:"Nearest target",chance:"Chance by luck",pct:"Site rank",km:"km",
    kind:{mine:"worked mine",occurrence:"known occurrence"},
    legend:["Known site and 2 km circle","MADAR targets (T1 strongest)","Bright areas = MADAR score"],
    lim:`<b>Honest limits:</b><ul><li>The number of sites is still small; the result will move with more sites.</li><li>Worked mines can light up because of their pits and tailings; we report them apart from unmined occurrences.</li><li>Some sites are close together (Bou Azzer district), so not fully independent.</li><li>Coordinates come from public sources (Mindat, Wikipedia) and may be a few hundred metres off.</li><li>MADAR narrows the search; it does not prove a deposit.</li></ul>`}
};
let lang = "ar";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const t = T[lang], s = DATA.summary;
  $("wrap").dir = t.dir; document.documentElement.lang = lang; document.documentElement.dir = t.dir;
  [...$("langs").children].forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  $("back").textContent = t.back; $("h1").textContent = t.h1; $("sub").textContent = t.sub(s.n, DATA.box_km);
  const v = [`${s.hits}/${s.n}`, `${s.expected_by_chance}`, s.lift ? `×${s.lift}` : "—", `${(s.p_value*100).toFixed(s.p_value<0.01?2:1)}%`];
  $("verdict").innerHTML = v.map((x, i) => `<div class="k glass ${i===0||i===2?"main":""}"><b>${x}</b><span>${t.k[i]}</span></div>`).join("");
  $("read").innerHTML = t.read(s);
  $("legend").innerHTML = `<span><i style="background:#62e3ff"></i>${t.legend[0]}</span><span><i style="background:#ffb85c"></i>${t.legend[1]}</span><span><i style="background:#ffd250"></i>${t.legend[2]}</span>`;
  $("grid").innerHTML = DATA.sites.map(r => `<article class="card glass">
    <img src="${esc(r.img)}" alt="${esc(r.name)}" loading="lazy">
    <div class="cb"><div class="row"><h3>${esc(r.name)}</h3><span class="badge ${r.hit?"ok":"no"}">${r.hit?t.hit:t.miss}</span></div>
      <p>${esc(r.area)}, ${esc(r.country)} · ${esc(r.metal)} · ${t.kind[r.kind]}</p>
      <div class="facts"><div><b>${r.nearest_km ?? "—"} ${t.km}</b><span>${t.dist}</span></div><div><b>${(r.p_chance*100).toFixed(0)}%</b><span>${t.chance}</span></div><div><b>${r.percentile ?? "—"}%</b><span>${t.pct}</span></div></div>
      <div class="src">${r.lat.toFixed(4)}, ${r.lon.toFixed(4)} · ${esc(r.src)} · ${esc(r.scenes.join(", "))}</div></div></article>`).join("");
  $("lim").innerHTML = t.lim;
}
try{ const l = localStorage.getItem("madar-min-lang"); if (T[l]) lang = l; }catch(e){}
if (DATA.demo) $("demo").hidden = false;
$("langs").onclick = e => { const b = e.target.closest("button"); if (!b) return; lang = b.dataset.l; try{localStorage.setItem("madar-min-lang", lang)}catch(e){} render(); };
render();
</script>
</body>
</html>
