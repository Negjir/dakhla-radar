<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Madar Minerals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Madar Minerals - the target console.
   Identity: the copper minerals themselves. Malachite green ground, native-gold accent (used sparingly),
   azurite blue for the known reference site, cuprite red for a miss. The map is presented as a printed
   survey plate: neatline frame with a graduated graticule, classic alternating scale bar, north arrow.
   Type: Amiri (Arabic) / Spectral (Latin) for titles and figures; IBM Plex Sans (Arabic + Latin) for UI. */
:root{
  --malachite:#0c1f1b; --malachite-2:#10291f; --panel:#122d27; --rule:#2c5248; --rule-2:#3f6c60;
  --gold:#cba35c; --gold-2:#e4c88e; --ivory:#efe8d8; --sage:#9fb3a8; --sage-2:#6f877c;
  --azurite:#5b8bd0; --cuprite:#c45a42; --verdigris:#7fc2a6;
  --title-ar:"Amiri",serif; --title-lat:"Spectral",Georgia,serif;
  --ui:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif; --ui-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--malachite);color:var(--ivory);font:400 14px/1.55 var(--ui);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(140% 90% at 70% -10%,#15382f 0%,var(--malachite) 60%)}
[dir="rtl"] body,[dir="rtl"]{font-family:var(--ui-ar)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums lining-nums}
.title{font-family:var(--title-lat);font-weight:400;letter-spacing:-.005em}
[dir="rtl"] .title{font-family:var(--title-ar);letter-spacing:0}

.app{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr);}
@media (min-width:981px){html,body{overflow:hidden}.app{height:100%}}

/* ---------- header ---------- */
.hd{grid-column:1/-1;min-width:0;display:flex;align-items:center;gap:28px;padding:14px 28px 12px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;flex:none;text-decoration:none}
.brand svg{flex:none}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font:500 24px/1 var(--title-lat);letter-spacing:.02em;color:var(--ivory)}
.brand .wm span{font-size:12px;color:var(--gold);margin-top:4px;letter-spacing:.04em}
.sites{display:flex;gap:22px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sites::-webkit-scrollbar{display:none}
.site-t{flex:none;border:0;background:none;padding:6px 0 7px;cursor:pointer;text-align:start;color:var(--sage);border-bottom:1.5px solid transparent;transition:color .2s,border-color .2s}
.site-t b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap}
.site-t span{display:block;font-size:11.5px;color:var(--sage-2);white-space:nowrap}
.site-t:hover{color:var(--ivory)}
.site-t[aria-selected="true"]{color:var(--ivory);border-bottom-color:var(--gold)}
.hd-end{display:flex;align-items:center;gap:18px;flex:none}
.proof{font-size:13px;text-decoration:none;color:var(--sage);border-bottom:1px solid var(--rule-2);padding-bottom:1px;white-space:nowrap}
.proof b{color:var(--gold-2);font-weight:600}
.proof:hover{color:var(--ivory);border-color:var(--gold)}
.langs{display:inline-flex;gap:2px;direction:ltr}
.langs button{border:0;background:none;padding:6px 8px;font-size:13px;color:var(--sage-2);cursor:pointer;min-height:34px;min-width:34px;border-radius:2px}
.langs button[aria-pressed="true"]{color:var(--ivory);background:rgba(203,163,92,.14)}
.demo{font-size:11px;color:var(--malachite);background:var(--gold);padding:2px 7px;border-radius:2px}

/* ---------- map plate ---------- */
.plate{position:relative;min-height:420px;border-inline-end:1px solid var(--rule);background:#0a1916;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.layers{position:absolute;z-index:5;top:16px;inset-inline-start:20px;display:flex;flex-wrap:wrap;gap:2px;padding:3px;background:rgba(12,31,27,.86);border:1px solid var(--rule);border-radius:3px;backdrop-filter:blur(6px);max-width:calc(100% - 240px)}
.layers button{border:0;background:none;padding:6px 11px;font-size:12.5px;color:var(--sage);cursor:pointer;min-height:32px;border-radius:2px;white-space:nowrap}
.layers button:hover{color:var(--ivory)}
.layers button[aria-pressed="true"]{color:var(--malachite);background:var(--gold-2);font-weight:600}
.reveal{position:absolute;z-index:5;top:16px;inset-inline-end:20px;border:1px solid var(--azurite);color:#cfe0f7;background:rgba(12,31,27,.86);border-radius:3px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;min-height:38px;backdrop-filter:blur(6px)}
.reveal:hover{background:rgba(91,139,208,.18)}
.reveal[aria-pressed="true"]{background:var(--azurite);color:#fff}
.legend{position:absolute;z-index:5;bottom:22px;inset-inline-start:20px;background:rgba(12,31,27,.88);border:1px solid var(--rule);border-radius:3px;padding:9px 12px;font-size:12px;color:var(--sage);max-width:min(330px,calc(100% - 40px));backdrop-filter:blur(6px)}
.legend .bar{height:6px;margin:6px 0 4px;background:linear-gradient(90deg,rgba(180,60,20,.35),#ff8c00,#ffd250,#ffffdc)}
.legend{min-width:160px}
.legend .two{display:flex;justify-content:space-between;gap:16px}
.legend .rgb{display:flex;gap:12px;flex-wrap:wrap}
.legend .rgb i{display:inline-block;width:9px;height:9px;margin-inline-end:5px;vertical-align:-1px}
.zoom{position:absolute;z-index:5;bottom:22px;inset-inline-end:20px;display:grid;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:rgba(12,31,27,.88)}
.zoom button{width:38px;height:38px;border:0;background:none;color:var(--ivory);font-size:18px;cursor:pointer}
.zoom button+button{border-top:1px solid var(--rule)}
.zoom button:hover{background:rgba(203,163,92,.14)}
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--malachite);border:1px solid var(--gold);border-radius:2px;padding:5px 9px;font-size:12px;direction:ltr;white-space:nowrap;display:none}

/* ---------- dossier ---------- */
.dossier{min-height:0;overflow:auto;padding:26px 28px 34px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.dossier section{padding:20px 0;border-top:1px solid var(--rule)}
.dossier section:first-child{padding-top:0;border-top:0}
.head h1{margin:0;font-size:38px;line-height:1.15;color:var(--ivory)}
.head .sub{margin:6px 0 0;color:var(--sage);font-size:13.5px}
.head .model{margin:2px 0 0;color:var(--sage-2);font-size:12.5px}
.ledger{margin:20px 0 0;display:grid;grid-template-columns:1fr auto;row-gap:0;font-size:13.5px}
.ledger dt{color:var(--sage);padding:9px 0;border-bottom:1px solid rgba(44,82,72,.6)}
.ledger dd{margin:0;padding:6px 0;border-bottom:1px solid rgba(44,82,72,.6);text-align:end;font:400 20px/1.3 var(--title-lat);color:var(--ivory)}
.ledger dd small{font:400 12px var(--ui);color:var(--sage-2);margin-inline-start:4px}
.ledger dd.gold{color:var(--gold-2);font-size:26px}
.dl{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.dl a{flex:1 1 150px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 12px;font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--gold);color:var(--gold-2);border-radius:2px;transition:background .2s,color .2s}
.dl a:hover{background:var(--gold);color:var(--malachite)}
.dl a svg{flex:none}
h2{margin:0 0 10px;font-size:22px;line-height:1.3;color:var(--ivory)}
.blind p{margin:0;color:var(--sage);font-size:13.5px;line-height:1.7}
.verdict{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.verdict .v{font:500 24px/1 var(--title-lat)}
[dir="rtl"] .verdict .v{font-family:var(--title-ar);font-weight:700}
.verdict .v.ok{color:var(--verdigris)}
.verdict .v.no{color:var(--cuprite)}
.blind .main{color:var(--ivory);font-size:14px}
.blind .meta{margin-top:8px;font-size:12px;color:var(--sage-2);line-height:1.6}
.reveal2{margin-top:14px;width:100%;min-height:42px;border:1px solid var(--azurite);background:none;color:#cfe0f7;border-radius:2px;font-size:13.5px;font-weight:500;cursor:pointer}
.reveal2:hover{background:rgba(91,139,208,.16)}
.tlist{list-style:none;margin:0;padding:0}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 6px;border-bottom:1px solid rgba(44,82,72,.6);cursor:pointer;border-radius:2px}
.trow:hover{background:rgba(203,163,92,.06)}
.trow[aria-current="true"]{background:rgba(203,163,92,.11)}
.trow .rk{grid-row:span 2;font:400 26px/1 var(--title-lat);color:var(--gold);text-align:center}
.trow .rk sup{font-size:12px;color:var(--sage-2);margin-inline-start:1px}
.trow .co{font-size:13px;color:var(--ivory);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start}
.trow .mt{font-size:12px;color:var(--sage-2)}
.trow .st{grid-row:span 2;display:grid;justify-items:end;gap:6px}
.trow .bar{width:64px;height:2px;background:var(--rule);direction:ltr}
.trow .bar i{display:block;height:100%;background:var(--gold)}
.copy{border:0;background:none;padding:2px 0;font-size:12px;color:var(--sage);cursor:pointer;border-bottom:1px solid var(--rule-2)}
.copy:hover{color:var(--ivory);border-color:var(--gold)}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline}
details summary::-webkit-details-marker{display:none}
details summary h2{margin:0}
details summary::after{content:"+";font:300 22px/1 var(--title-lat);color:var(--gold)}
details[open] summary::after{content:"−"}
.txt{margin:12px 0 0;font-size:13.5px;line-height:1.75;color:var(--sage)}
.txt ol,.txt ul{margin:0;padding-inline-start:20px}
.txt li{margin-bottom:6px}
.txt b{color:var(--ivory);font-weight:500}
.src{font-size:11.5px;color:var(--sage-2);line-height:1.7;word-break:break-all}
.src .num{direction:ltr}

/* ---------- one orchestrated moment: targets settle in by rank ---------- */
@keyframes settle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.trow{animation:settle .5s cubic-bezier(.2,.7,.2,1) both}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 64vh auto}
  .plate,.dossier{min-width:0}
  .hd{flex-wrap:wrap;gap:12px 18px;padding:12px 16px}
  .sites{order:3;flex-basis:100%}
  .hd-end{margin-inline-start:auto}
  .plate{border-inline-end:0;border-bottom:1px solid var(--rule)}
  .layers{top:10px;inset-inline-start:10px;max-width:calc(100% - 20px)}
  .reveal{display:none}
  .legend{bottom:12px;inset-inline-start:10px;max-width:calc(100% - 76px)}
  .zoom{bottom:12px;inset-inline-end:10px}
  .dossier{overflow:visible;padding:22px 16px 40px}
  .head h1{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    <section><details><summary><h2 class="title" id="limTitle"></h2></summary><div class="txt" id="limits"></div></details></section>
    <section class="src" id="foot"></section>
  </aside>
</div>

const C = {gold:"#cba35c", gold2:"#e4c88e", ivory:"#efe8d8", sage:"#9fb3a8", mal:"#0c1f1b", azur:"#5b8bd0", rule:"#2c5248"};

/* ---------- canvas map: equirectangular, lon scaled by cos(lat) ---------- */

const P = (lat, lon) => [W/2 + (lon - view.lon) * view.k * view.cos, H/2 - (lat - view.lat) * view.k];
const G = (x, y) => [view.lat - (y - H/2) / view.k, view.lon + (x - W/2) / (view.k * view.cos)];
function fit(pts, pad=60){

  view.k = Math.min((H - 2*pad) / Math.max(la1-la0, 1e-4), (W - 2*pad) / (Math.max(lo1-lo0, 1e-4) * view.cos));
  draw();
}
function zoom(f, x=W/2, y=H/2){
  const [la, lo] = G(x, y);
  view.k = Math.max(minK(), Math.min(view.k * f, 600000));
  const [x2, y2] = P(la, lo);
  view.lon += (x2 - x) / (view.k * view.cos); view.lat -= (y2 - y) / view.k; draw();
}
const minK = () => { const b = S().bounds; return 0.5 * Math.min(H / (b[1][0]-b[0][0]), W / ((b[1][1]-b[0][1]) * view.cos)); };

function graticule(x0, y0, x1, y1, b){
  // neatline: double gold rule around the scene, graduated in minutes of arc, labelled like a survey plate
  cx.save();
  cx.strokeStyle = C.gold; cx.lineWidth = 1; cx.strokeRect(x0 - 7.5, y0 - 7.5, x1 - x0 + 15, y1 - y0 + 15);
  cx.lineWidth = .6; cx.strokeStyle = "rgba(203,163,92,.55)"; cx.strokeRect(x0 - .5, y0 - .5, x1 - x0 + 1, y1 - y0 + 1);
  const spanPx = Math.min(x1 - x0, y1 - y0), spanDeg = (b[1][0] - b[0][0]) * spanPx / (y1 - y0);
  const steps = [1/60, 2/60, 5/60, 10/60, 15/60, 30/60, 1];
  const st = steps.find(s => spanDeg / s <= 7) || 1;
  const label = (v, p, n) => { const a = Math.abs(v), d = Math.floor(a + 1e-9), m = Math.round((a - d) * 60); return `${d}°${String(m).padStart(2,"0")}′${v>=0?p:n}`; };
  cx.font = `400 11px ${lang === "ar" ? "IBM Plex Sans Arabic" : "IBM Plex Sans"}, sans-serif`; cx.fillStyle = C.sage;
  for (let la = Math.ceil(b[0][0] / st) * st; la <= b[1][0] + 1e-9; la += st){
    const [, y] = P(la, b[0][1]); if (y < y0 || y > y1) continue;
    cx.beginPath(); cx.moveTo(x0 - 7.5, y); cx.lineTo(x0 - 1, y); cx.moveTo(x1 + 1, y); cx.lineTo(x1 + 7.5, y); cx.strokeStyle = C.gold; cx.lineWidth = 1; cx.stroke();
    cx.save(); cx.translate(x0 - 12, y); cx.rotate(-Math.PI/2); cx.textAlign = "center"; cx.textBaseline = "bottom"; cx.fillText(label(la,"N","S"), 0, 0); cx.restore();
  }
  for (let lo = Math.ceil(b[0][1] / st) * st; lo <= b[1][1] + 1e-9; lo += st){
    const [x] = P(b[0][0], lo); if (x < x0 || x > x1) continue;
    cx.beginPath(); cx.moveTo(x, y0 - 7.5); cx.lineTo(x, y0 - 1); cx.moveTo(x, y1 + 1); cx.lineTo(x, y1 + 7.5); cx.strokeStyle = C.gold; cx.lineWidth = 1; cx.stroke();
    cx.textAlign = "center"; cx.textBaseline = "top"; cx.fillText(label(lo,"E","W"), x, y1 + 11);
  }
  cx.restore();
}
function scaleBar(){
  const kmPx = view.k / 111.32, nice = [0.2,0.5,1,2,5,10,20,50].find(v => v * kmPx > 110) || 50;
  const len = nice * kmPx, x = W/2 - len/2, y = W < 600 ? H - 96 : H - 30;
  cx.save();
  for (let i = 0; i < 4; i++){ cx.fillStyle = i % 2 ? C.mal : C.ivory; cx.fillRect(x + i*len/4, y, len/4, 5); }
  cx.strokeStyle = C.ivory; cx.lineWidth = 1; cx.strokeRect(x + .5, y + .5, len - 1, 5);
  cx.font = "400 12px Spectral, Georgia, serif"; cx.fillStyle = C.ivory; cx.textAlign = "center"; cx.textBaseline = "bottom";
  cx.fillText("0", x, y - 4); cx.fillText(`${nice} km`, x + len, y - 4);
  cx.restore();
}
function northArrow(x, y){
  cx.save(); cx.translate(x, y);
  cx.beginPath(); cx.moveTo(0, -18); cx.lineTo(7, 10); cx.lineTo(0, 4); cx.closePath(); cx.fillStyle = C.gold2; cx.fill();
  cx.beginPath(); cx.moveTo(0, -18); cx.lineTo(-7, 10); cx.lineTo(0, 4); cx.closePath(); cx.strokeStyle = C.gold2; cx.lineWidth = 1; cx.stroke();
  cx.font = "500 13px Spectral, Georgia, serif"; cx.fillStyle = C.ivory; cx.textAlign = "center"; cx.fillText("N", 0, -24);
  cx.restore();
}
function draw(){
  if (!W) return;
  const s = S(), b = s.bounds, now = performance.now();
  cx.setTransform(DPR,0,0,DPR,0,0); cx.clearRect(0,0,W,H);
  const [x0, y0] = P(b[1][0], b[0][1]), [x1, y1] = P(b[0][0], b[1][1]);
  cx.imageSmoothingEnabled = view.k < 6000;
  const base = img(s.images["truecolor.jpg"]);
  if (layer === "ratios" || layer === "struct"){ const r = img(s.images[layer + ".jpg"]); r.complete && cx.drawImage(r, x0, y0, x1-x0, y1-y0); }
  else {
    if (base.complete){ cx.globalAlpha = layer === "truecolor" ? 1 : .55; cx.drawImage(base, x0, y0, x1-x0, y1-y0); cx.globalAlpha = 1; }
    if (layer !== "truecolor"){ const o = img(s.images[layer + ".png"]); o.complete && cx.drawImage(o, x0, y0, x1-x0, y1-y0); }
  }
  graticule(x0, y0, x1, y1, b);
  if (revealed) s.blind_test.forEach(k => {
    const [kx, ky] = P(k.lat, k.lon), rpx = DATA.hit_km / 111.32 * view.k;
    cx.beginPath(); cx.arc(kx, ky, rpx, 0, 7); cx.fillStyle = "rgba(91,139,208,.08)"; cx.fill();
    cx.setLineDash([2,4]); cx.strokeStyle = C.azur; cx.lineWidth = 1.2; cx.stroke(); cx.setLineDash([]);
    const g = s.targets.find(t => t.label === k.nearest_target);
    if (g){ const [gx, gy] = P(g.lat, g.lon); cx.strokeStyle = C.azur; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(kx, ky); cx.lineTo(gx, gy); cx.stroke();
      const mx = (kx+gx)/2, my = (ky+gy)/2, lab = k.nearest_km + " km";
      cx.font = "500 13px Spectral, Georgia, serif"; const w = cx.measureText(lab).width + 12;
      cx.fillStyle = C.mal; cx.fillRect(mx - w/2, my - 20, w, 18); cx.fillStyle = "#cfe0f7"; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText(lab, mx, my - 11); }
  });
  let anim = false;
  s.targets.slice().reverse().forEach(t => {
    const age = (now - born - t.rank * 70) / 420, a = Math.max(0, Math.min(1, age)); if (a < 1) anim = true; if (a <= 0) return;
    const [x, y] = P(t.lat, t.lon), top = t.rank <= 3, on = t.rank === sel, r = (top ? 13 : 11) * (0.6 + 0.4 * a);
    cx.globalAlpha = a;
    if (on){ cx.beginPath(); cx.arc(x, y, r + 6, 0, 7); cx.strokeStyle = C.gold2; cx.lineWidth = 1; cx.stroke(); }
    cx.beginPath(); cx.arc(x, y, r, 0, 7);
    cx.fillStyle = top ? C.gold2 : "rgba(12,31,27,.88)"; cx.fill();
    cx.lineWidth = 1.4; cx.strokeStyle = top ? C.mal : C.gold2; cx.stroke();
    cx.fillStyle = top ? C.mal : C.ivory; cx.font = `500 ${top ? 12.5 : 11.5}px Spectral, Georgia, serif`; cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(String(t.rank), x, y + .5);
    cx.globalAlpha = 1;
  });
  if (revealed) s.blind_test.forEach(k => {
    const [kx, ky] = P(k.lat, k.lon);
    cx.save(); cx.translate(kx, ky); cx.rotate(Math.PI/4);
    cx.fillStyle = C.azur; cx.fillRect(-8,-8,16,16); cx.lineWidth = 1.5; cx.strokeStyle = "#e9f0fb"; cx.strokeRect(-8,-8,16,16); cx.restore();
    cx.font = `400 15px ${TFONT()}`; cx.textAlign = "center"; cx.textBaseline = "top";
    const lab = L().known, w = cx.measureText(lab).width + 16;
    cx.fillStyle = C.mal; cx.fillRect(kx - w/2, ky - 44, w, 24); cx.strokeStyle = C.azur; cx.lineWidth = 1; cx.strokeRect(kx - w/2 + .5, ky - 43.5, w - 1, 23);
    cx.fillStyle = "#e9f0fb"; cx.fillText(lab, kx, ky - 40);
  });
  scaleBar(); northArrow(L().dir === "rtl" ? 40 : W - 40, H - 128);
  if (anim) requestAnimationFrame(draw);
}
/* pointer: drag, pinch, wheel, click on targets */
const ptrs = new Map(); let moved = false, pinch0 = 0;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.offsetX, e.offsetY]); moved = false; cv.classList.add("drag"); if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0]-b[0], a[1]-b[1]); } });
cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)){ hover(e.offsetX, e.offsetY); return; }
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0]-b[0], a[1]-b[1]); if (pinch0) zoom(d / pinch0, (a[0]+b[0])/2, (a[1]+b[1])/2); pinch0 = d; moved = true; return; }
  const dx = e.offsetX - prev[0], dy = e.offsetY - prev[1];
  if (Math.abs(dx) + Math.abs(dy) > 1) moved = true;
  view.lon -= dx / (view.k * view.cos); view.lat += dy / view.k; draw();
});
const up = e => { ptrs.delete(e.pointerId); pinch0 = 0; cv.classList.remove("drag"); if (!moved && e.type === "pointerup"){ const t = hit(e.offsetX, e.offsetY); if (t) focusTarget(t.rank); } };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("wheel", e => { e.preventDefault(); zoom(Math.exp(-e.deltaY * 0.0015), e.offsetX, e.offsetY); }, {passive:false});
$("zin").onclick = () => zoom(1.6); $("zout").onclick = () => zoom(1/1.6);
function hit(x, y){ return S().targets.find(t => { const [px, py] = P(t.lat, t.lon); return Math.hypot(px-x, py-y) < 16; }); }
function hover(x, y){
  const t = hit(x, y), tip = $("tip");
  if (!t){ tip.style.display = "none"; cv.style.cursor = ""; return; }
  cv.style.cursor = "pointer"; tip.style.display = "block"; tip.textContent = `${t.label}   ${ll(t.lat, t.lon)}   ${t.area_ha} ha`;
  tip.style.left = Math.min(x + 16, W - tip.offsetWidth - 8) + "px"; tip.style.top = (y - 36) + "px";
}

const ICON = {
  dl:'<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0l-3.2-3.2M8 10l3.2-3.2M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
  doc:'<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.8h5.2L12.5 5v9.2H4z M9 1.8V5h3.5 M6 8h4.5 M6 10.5h4.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>'
};
function init(){
  try{ const l = localStorage.getItem("madar-min-lang"); if (T[l]) lang = l; }catch(e){}
  if (DATA.demo) $("demo").hidden = false;
  $("langs").onclick = e => { const b = e.target.closest("button"); if (!b) return; lang = b.dataset.l; try{localStorage.setItem("madar-min-lang", lang)}catch(e){} render(true); };

  const hi = DATA.sites.findIndex(s => "#" + s.id === location.hash); if (hi >= 0) cur = hi;     // ./#anzarane opens that site
  render(false);
  const at = document.querySelector(`.site-t[data-i="${cur}"]`); if (at && at.scrollIntoView) at.scrollIntoView({block: "nearest", inline: "center"});

}
const SAHARA_T={ar:"مسح الصحراء",fr:"Levé du Sahara",en:"Sahara survey"},FIELD_T={ar:"مدار الميدان",fr:"Madar Terrain",en:"Madar Field"};
function proofText(){

}
function render(keepView){

    <dl class="ledger"><dt>${t.area}</dt><dd><span class="num">${s.area_km2.toLocaleString("en")}</span><small>${t.km2}</small></dd>
      <dt>${t.anom}</dt><dd><span class="num">${s.anomaly_km2}</span><small>${t.km2}</small></dd>
      <dt>${t.red}</dt><dd class="gold"><span class="num">×${s.reduction.toLocaleString("en")}</span></dd></dl>

      <span class="rk num">${g.rank}</span>

      <span class="st"><span class="bar"><i style="width:${g.rel}%"></i></span><button class="copy" data-c="${g.lat.toFixed(5)}, ${g.lon.toFixed(5)}">${t.copy}</button></span>
      <span class="mt"><span class="num">${g.area_ha}</span> ${t.ha}، <span class="num">${g.rel}%</span> ${t.rel}${g.struct_km!=null&&g.struct_km<0.5?` · <b style="color:var(--gold-2)">${t.onFault}</b>`:""}${g.ring_km!=null&&g.ring_km<0.5?` · <b style="color:var(--azurite)">${t.onRing}</b>`:""}${g.emit&&g.emit.fam?` · <b style="color:${FAMC[g.emit.fam]}">EMIT: ${t.fam[g.emit.fam]} ×${g.emit.x}</b>`:""}</span></li>`).join("");
  if (lang !== "ar") $("targets").querySelectorAll(".mt").forEach((m, i) => { const g = s.targets[i]; m.innerHTML = `<span class="num">${g.area_ha}</span> ${t.ha}, <span class="num">${g.rel}%</span> ${t.rel}${g.struct_km!=null&&g.struct_km<0.5?` · <b style="color:var(--gold-2)">${t.onFault}</b>`:""}${g.ring_km!=null&&g.ring_km<0.5?` · <b style="color:var(--azurite)">${t.onRing}</b>`:""}${g.emit&&g.emit.fam?` · <b style="color:${FAMC[g.emit.fam]}">EMIT: ${t.fam[g.emit.fam]} ×${g.emit.x}</b>`:""}`; });
  $("targets").onclick = e => {
    const c = e.target.closest(".copy");
    if (c){ e.stopPropagation(); navigator.clipboard && navigator.clipboard.writeText(c.dataset.c).then(() => { c.textContent = t.copied; setTimeout(() => c.textContent = t.copy, 1200); }); return; }

  };
  $("targets").onkeydown = e => { if (e.key === "Enter"){ const r = e.target.closest(".trow"); if (r) focusTarget(+r.dataset.r); } };
  $("mTitle").textContent = t.mTitle; $("method").innerHTML = t.method.replace("${TOP}", DATA.top_percent);
  $("limTitle").textContent = t.limTitle; $("limits").innerHTML = t.limits;

function renderReveal(){ $("reveal").style.visibility = S().blind_test.length ? "" : "hidden"; $("reveal").textContent = revealed ? L().hide : L().reveal; $("reveal").setAttribute("aria-pressed", revealed); }
const FAMC={copper:"#00c8b4",ree:"#9d4edd",serpentine:"#78a078",alunite:"#ff2d55",kaolinite:"#ff6ec7",pyrophyllite:"#c77dff",muscovite:"#ffd60a",montmorillonite:"#f4a261",chlorite:"#52b788",epidote:"#2d6a4f",carbonate:"#4cc9f0",gypsum:"#e6e6e6",jarosite:"#c08a00",hematite:"#d62828",goethite:"#f77f00",iron_oxide:"#e76f51",clay:"#b5838d",mafic:"#5a626e"};
function renderEmit(){
  const t = L(), s = S(), e = s.emit, box = $("emit");
  if (!e){ box.innerHTML = ""; return; }
  const fams = Object.entries(e.families).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const on = s.targets.filter(g => g.emit && g.emit.fam);
  box.innerHTML = `<h2 class="title">${t.emT}</h2><p>${t.emP(e.coverage_pct, e.scenes.length)}</p>
    <div class="meta" style="margin-top:8px">${fams.map(([f,p])=>`<span style="display:inline-flex;align-items:center;gap:6px;margin:2px 10px 2px 0"><i style="width:10px;height:10px;border-radius:2px;background:${FAMC[f]}"></i>${t.fam[f]||f} <b class="num">${p}%</b></span>`).join("")}</div>
    <p class="meta">${t.emOn}: <b class="num">${on.length}</b>/${s.targets.length}${on.length?"<br>"+on.map(g=>`${g.label}: ${t.fam[g.emit.fam]||g.emit.fam} <span class="num">×${g.emit.x}</span>`).join(" · "):""}</p>
    ${e.iron?`<p class="meta">${t.emFe}: ${Object.entries(e.iron).slice(0,3).map(([f,p])=>`${t.fam[f]||f} <span class="num">${p}%</span>`).join(" · ")}</p>`:""}
    <p class="meta">${esc(e.src)}</p>`;
}
function renderStruct(){
  const t = L(), s = S(), st = s.structure, box = $("struct");
  if (!st){ box.innerHTML = ""; return; }
  const R = 46, cxr = 60, mx = Math.max(...st.rose, 1e-6);
  let petals = "";
  st.rose.forEach((v, i) => { for (const off of [0, 180]) { const a0 = (i * 10 + off - 90) * Math.PI / 180, a1 = ((i + 1) * 10 + off - 90) * Math.PI / 180, rr = 6 + (R - 6) * v / mx;
    const h = ((i * 10 + 5) * 2) % 360;
    petals += `<path d="M${cxr},${cxr} L${cxr + rr * Math.cos(a0)},${cxr + rr * Math.sin(a0)} A${rr},${rr} 0 0 1 ${cxr + rr * Math.cos(a1)},${cxr + rr * Math.sin(a1)} Z" fill="hsl(${h},70%,62%)" fill-opacity=".85" stroke="#0c1f1b" stroke-width=".5"/>`; } });
  const rose = `<svg width="120" height="120" viewBox="0 0 120 120" style="flex:none"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#2c5248"/><circle cx="60" cy="60" r="${R/2}" fill="none" stroke="#2c5248" stroke-dasharray="2 3"/>${petals}
    <text x="60" y="9" text-anchor="middle" fill="#e4c88e" font-size="10" font-family="Spectral">N</text></svg>`;
  const on = s.targets.filter(g => g.struct_km != null && g.struct_km < 0.5).length, onr = s.targets.filter(g => g.ring_km != null && g.ring_km < 0.5).length;
  box.innerHTML = `<h2 class="title">${t.stT}</h2><p>${t.stP(st.rings.length, Math.round(st.dominant_az), st.lineament_km)}</p>
    <div style="display:flex;gap:14px;align-items:center;margin-top:10px">${rose}<div class="meta" style="margin:0">${t.stRose}<br>${st.rings.length ? st.rings.map(t.stRing).join("<br>") : t.stNone}<br><br>${t.onFault}: <b class="num">${on}</b>/${s.targets.length} · ${t.onRing}: <b class="num">${onr}</b>/${s.targets.length}</div></div>`;
}
function renderBlind(){
  const t = L(), s = S();
  if (!s.blind_test.length){ $("blind").innerHTML = `<h2 class="title">${t.prospectT}</h2><p>${t.prospect}</p>`; return; }
  let h = `<h2 class="title">${t.blindT}</h2>`;
  if (!revealed) h += `<p>${t.blindHidden}</p>`;
  else s.blind_test.forEach(b => {
    const ok = b.hit;
    h += `<div class="verdict"><span class="v ${ok?"ok":"no"}">${ok?t.hitV:t.missV}</span></div>
      <p class="main">${ok ? t.hit(esc(b.name), b.nearest_target, `<span class="num">${b.nearest_km}</span>`, b.best_rank_within) : t.miss(esc(b.name), b.nearest_target, `<span class="num">${b.nearest_km}</span>`)}</p>
      <p>${t.pct(`<span class="num">${b.percentile}</span>`)} ${t.kind[b.kind]}</p>
      <p class="meta"><span class="num">${ll(b.lat,b.lon)}</span><br>${esc(b.src)}</p>`;
  });
  h += `<button class="reveal2" id="reveal2">${revealed ? t.hide : t.reveal}</button>`;
  $("blind").innerHTML = h;
  $("reveal2").onclick = () => $("reveal").onclick();
}
function renderLegend(){
  const t = L();
  if (layer === "truecolor"){ $("legend").textContent = t.tc; return; }
  if (layer === "emit"){ const e = S().emit || {families:{}}; $("legend").innerHTML = Object.keys(e.families).sort((a,b)=>e.families[b]-e.families[a]).slice(0,8).map(f=>`<div><i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;background:${FAMC[f]}"></i>${t.fam[f]||f}</div>`).join("") + `<div style="opacity:.75"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;background:#333"></i>${t.emNc}</div>`; return; }
  if (layer === "struct"){ $("legend").innerHTML = `<div class="bar" style="background:linear-gradient(90deg,#ff8080,#80ff80,#8080ff,#ff8080)"></div><div>${t.stLeg.join("<br>")}</div>`; return; }
  if (layer === "ratios"){ const c = ["#e05050","#50d070","#5a90f0"]; $("legend").innerHTML = `<div class="rgb">${t.rgb.map((x,i)=>`<span><i style="background:${c[i]}"></i>${x}</span>`).join("")}</div>`; return; }
  $("legend").innerHTML = `${t.layers[layer]}<div class="bar"></div><div class="two"><span>${t.low}</span><span>${t.high}</span></div>`;
}
function fitReveal(){
  const s = S(), pts = [];
  s.blind_test.forEach(b => { pts.push([b.lat, b.lon]); const g = s.targets.find(x => x.label === b.nearest_target); if (g) pts.push([g.lat, g.lon]);
    const d = DATA.hit_km / 111.32; pts.push([b.lat - d, b.lon - d / view.cos], [b.lat + d, b.lon + d / view.cos]); });
  fit(pts, 90);
}
function focusTarget(r){
  const g = S().targets.find(x => x.rank === r); if (!g) return;
  sel = r; view.lat = g.lat; view.lon = g.lon; view.k = Math.max(view.k, 900 / 0.03 * (H / 900)); draw();
  document.querySelectorAll(".trow").forEach(x => x.setAttribute("aria-current", +x.dataset.r === r));
}
