  stp:(d)=>`حرارة الماء: ${d.sst_day||"–"} · الكلوروفيل: ${d.chl_day||"–"} · صورة Sentinel-2: ${d.s2?d.s2.day:"لا صورة صافية"}`,
  lv:["هادئ","انتباه","إنذار"],approx:"مواقع المناطق تقريبية حسب أسماء النشرات الرسمية. صححوها معنا بإحداثيات أحواضكم الحقيقية.",
  noimg:"لا توجد صورة Sentinel-2 صافية للخليج في الأيام الأخيرة (غيوم).",
  lgChl:["ماء صافٍ","أخضر","طحالب كثيفة"],lgTurb:["صافٍ","عكر"],lgTrue:"ألوان طبيعية كما تراها العين",
  s2date:(s)=>`صورة ${s.day} (قبل ${s.age} يوم)`,ndci:"مؤشر الطحالب",fnu:"عكارة",
  toxin:"<b>الأقمار لا تقيس السموم.</b> مدار المحار إنذار مبكر يقول لكم <b>أين ومتى</b> تزيدون أخذ العينات. قرار الجني والبيع يبقى فقط لنشرات المعهد الوطني للبحث في الصيد البحري (INRH) وكتابة الدولة المكلفة بالصيد البحري.",
  how:"كيف يعمل؟",src:"المصادر والتواريخ",
  howh:`<ul><li><b>الكلوروفيل</b> (من أقمار لون المحيط، 1 كم): هو غذاء المحار. نقارنه بـ<b>المعتاد في نفس الأسابيع من السنوات الماضية</b>. إذا تضاعف فهذا ازدهار طحالب محتمل، وبعض الطحالب تنتج سموماً.</li>
  <li><b>حرارة الماء</b> (NASA MUR، 1 كم): فوق 24° يبدأ الإجهاد، وفوق 26° يرتفع خطر النفوق. والبرودة المفاجئة تعني دخول مياه عميقة غنية قد يتبعها ازدهار.</li>
  <li><b>صورة Sentinel-2</b> (20 م): نرى الخليج كله، فنعرف <b>أين</b> بالضبط الماء الأخضر أو العكر. مؤشر الطحالب (NDCI) يقارن الأحمر بالأحمر الحافي.</li>
  <li><b>الرياح</b>: للعمل في الأحواض، ولأن الرياح الشمالية القوية تدفع الماء البارد الغني إلى الساحل.</li></ul>
  <p><b>حدود:</b> الخليج ضحل وعكر، فأقمار لون المحيط تعطي أرقام كلوروفيل أعلى من الحقيقة. لذلك نعتمد على <b>التغير</b> وليس على الرقم نفسه. وفي المياه العكرة جداً لا نستعمل مؤشر الطحالب لأن الرواسب والقاع يرفعانه. البيانات بدقة 1 كم تعطي صورة عامة لكل منطقة وليس لكل حوض. الغيوم تمنع الصورة بعض الأيام.</p>`,
  made:(d)=>`تحديث ${d.made} · يتجدد كل صباح تلقائياً`,f1:"مدار الساحل",f2:"مدار السفن الكبيرة",f3:"مدار المعادن",
  srck:{sst:"حرارة الماء",chl:"الكلوروفيل",clim:"المعتاد في الموسم",s2:"الصورة",wind:"الرياح"},normal:"المعتاد",demo:"بيانات تجريبية للعرض فقط، وليست قياسات حقيقية."},
 fr:{brand:"Madar · Huîtres",map:b=>`${b} vue du satellite`,planned:"La baie de Cintra est le secteur M3 de la zone aquacole prévue entre le nord de la baie de Dakhla et le sud de la baie de Cintra. Aucune position de ferme n'est publique : les trois secteurs sont approximatifs. La veille sert ici à choisir les meilleurs emplacements avant installation.",chl:"Algues",turb:"Turbidité",true:"Couleurs réelles",
  zones:"Zones conchylicoles",zs:"Touchez une zone pour voir ses courbes",trend:"30 derniers jours",sst:"Température de l'eau °C",chlt:"Chlorophylle mg/m³ (nourriture de l'huître, premier signe d'efflorescence)",
  msg:"Message du jour aux ostréiculteurs",msgs:"À copier dans le groupe WhatsApp",copy:"Copier le message",copied:"✓ Copié",wa:"Envoyer par WhatsApp",
  wind:"Vent 48 h",winds:"nœuds",work:"Vent fort pour le travail sur les parcs",
  st:["Situation calme dans toutes les zones","Vigilance dans certaines zones","Alerte : signal fort dans une zone ou plus"],
  stp:(d)=>`Température : ${d.sst_day||"–"} · Chlorophylle : ${d.chl_day||"–"} · Image Sentinel-2 : ${d.s2?d.s2.day:"pas d'image claire"}`,
  lv:["Calme","Vigilance","Alerte"],approx:"Positions des zones approximatives (noms des bulletins officiels). Corrigez-les avec les coordonnées réelles de vos parcs.",
  noimg:"Pas d'image Sentinel-2 claire de la baie ces derniers jours (nuages).",
  lgChl:["eau claire","verte","algues denses"],lgTurb:["claire","trouble"],lgTrue:"Couleurs naturelles, comme à l'œil",
  s2date:(s)=>`Image du ${s.day} (il y a ${s.age} j)`,ndci:"indice algues",fnu:"turbidité",
  toxin:"<b>Les satellites ne mesurent pas les toxines.</b> Madar Huîtres est une alerte précoce qui indique <b>où et quand</b> renforcer les prélèvements. La décision de récolte et de vente relève uniquement des bulletins de l'INRH et du Département de la Pêche maritime.",
  how:"Comment ça marche ?",src:"Sources et dates",
  howh:`<ul><li><b>Chlorophylle</b> (couleur de l'océan, 1 km) : la nourriture de l'huître. Comparée à la <b>normale des mêmes semaines des années passées</b> ; un doublement signale une efflorescence possible ; certaines microalgues produisent des toxines.</li>
  <li><b>Température</b> (NASA MUR, 1 km) : stress au-delà de 24°, risque de mortalité au-delà de 26°. Un refroidissement brutal signale une remontée d'eau profonde riche, souvent suivie d'efflorescences.</li>
  <li><b>Image Sentinel-2</b> (20 m) : toute la baie, pour voir <b>où</b> l'eau est verte ou trouble. L'indice algues (NDCI) compare le rouge et le red-edge.</li>
  <li><b>Vent</b> : pour le travail sur les parcs, et parce que le vent du nord fort pousse l'eau froide et riche vers la côte.</li></ul>
  <p><b>Limites :</b> baie peu profonde et turbide : les satellites de couleur de l'océan y surestiment la chlorophylle, d'où l'usage des <b>variations</b> plutôt que des valeurs. En eau très turbide, l'indice algues n'est pas utilisé (sédiments et fond le font monter). Les données à 1 km donnent une image par zone, pas par parc. Les nuages bloquent l'image certains jours.</p>`,
  made:(d)=>`Mis à jour ${d.made} · actualisé chaque matin`,f1:"Madar Côte",f2:"Madar Large",f3:"Madar Minerais",
  srck:{sst:"Température",chl:"Chlorophylle",clim:"Normale de saison",s2:"Image",wind:"Vent"},normal:"normale",demo:"Données de démonstration, pas des mesures réelles."}
};
let L=(()=>{try{return localStorage.getItem("madar-lang")||"ar"}catch(e){return "ar"}})();
let LAYER="chl",SEL=null;
const $=s=>document.querySelector(s);
const t=k=>T[L][k];
const COL=["var(--ok)","var(--warn)","var(--bad)"];
const imgs={};
function loadImg(k,src){return new Promise(r=>{const i=new Image();i.onload=()=>{imgs[k]=i;r()};i.onerror=()=>r();i.src=src+"?v="+encodeURIComponent(DATA.made)})}

function lang(l){L=l;try{localStorage.setItem("madar-lang",l)}catch(e){}
  document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.querySelectorAll(".tools button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));render()}

function render(){
  const d=DATA;
  $("#t-brand").textContent=t("brand");
  $("#demo").hidden=!d.demo;$("#demo").textContent=t("demo");
  $("#status").className="status l"+d.level;$("#st-h").textContent=t("st")[d.level];$("#st-p").textContent=t("stp")(d);
  $("#t-map").textContent=t("map")(d.bay?(L==="ar"?d.bay.ar:d.bay.fr):(L==="ar"?"خليج الداخلة":"La baie de Dakhla"));
  const nv=d.nav||[];$("#bays").hidden=nv.length<2;
  $("#bays").innerHTML=nv.map(b=>`<a href="${b.href}" class="bay" aria-current="${b.current?"page":"false"}" style="flex:1;text-align:center;text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:600;${b.current?"background:var(--lagoon);color:#fff":"color:var(--ink-2)"}">${L==="ar"?b.ar:b.fr}</a>`).join("");
  $("#planned").hidden=!(d.bay&&d.bay.planned);$("#planned").textContent=t("planned");
  document.querySelectorAll("#layers button").forEach(b=>{b.textContent=t(b.dataset.k);b.setAttribute("aria-pressed",b.dataset.k===LAYER)});
  $("#t-approx").textContent=(d.s2?t("s2date")(d.s2)+" · ":"")+t("approx");
  $("#t-zones").textContent=t("zones");$("#t-zones-s").textContent=t("zs");
  $("#t-trend").textContent=t("trend");$("#t-sst").textContent=t("sst");$("#t-chl").textContent=t("chlt");
  $("#t-msg").textContent=t("msg");$("#t-msg-s").textContent=t("msgs");
  $("#msg").textContent=L==="ar"?d.msg_ar:d.msg_fr;$("#copy").textContent=t("copy");
  $("#wa").textContent=t("wa");$("#wa").href="https://wa.me/?text="+encodeURIComponent(L==="ar"?d.msg_ar:d.msg_fr);
  $("#t-wind").textContent=t("wind");$("#t-wind-s").textContent=d.wind?`${t("winds")} · max ${d.wind.max_kn}`:"–";
  $("#t-toxin").innerHTML=t("toxin");$("#t-how").textContent=t("how");$("#how").innerHTML=t("howh");$("#t-src").textContent=t("src");
  const S=d.sources||{},K=t("srck");
  $("#src").innerHTML=Object.keys(K).map(k=>`<dt>${K[k]}</dt><dd>${S[k]||"–"}${k==="sst"&&d.sst_day?" · "+d.sst_day:""}${k==="chl"&&d.chl_day?" · "+d.chl_day:""}${k==="s2"&&d.s2?" · "+d.s2.day:""}</dd>`).join("");
  $("#t-made").textContent=t("made")(d);$("#f1").textContent=t("f1");$("#f2").textContent=t("f2");$("#f3").textContent=t("f3");
  const up=d.bay&&d.bay.id!=="dakhla"?"../../":"../";$("#f1").href=up+"coastal/";$("#f2").href=up;$("#f3").href=up+"minerals/";
  zonesList();legend();draw();charts();windChart();
}

function zname(z){return L==="ar"?z.ar:z.fr}
function zonesList(){
  const box=$("#zones");box.innerHTML="";
  DATA.zones.forEach(z=>{
    const b=document.createElement("button");b.className="zone";b.setAttribute("aria-pressed",SEL===z.id);
    const s2=z.s2||{};
    const nums=[`<span><b class="ltr">${z.sst!=null?z.sst.toFixed(1)+"°":"–"}</b></span>`,
      `<span>chl <b class="ltr">${z.chl!=null?z.chl.toFixed(1):"–"}</b>${z.chl_ratio?` <span class="ltr">×${z.chl_ratio.toFixed(1)}</span>`:""}</span>`];
    if(z.chl_normal!=null)nums.push(`<span>${t("normal")} <b class="ltr">${z.chl_normal.toFixed(1)}</b></span>`);
    if(s2.ndci!=null)nums.push(`<span>${t("ndci")} <b class="ltr">${s2.ndci.toFixed(2)}</b></span>`);
    if(s2.turb!=null)nums.push(`<span>${t("fnu")} <b class="ltr">${s2.turb.toFixed(0)}</b></span>`);
    b.innerHTML=`<div class="zt"><b>${zname(z)}</b><span class="chip c${z.level}">${t("lv")[z.level]}</span></div>
      <div class="nums">${nums.join("")}</div><ul class="why">${z.reasons.map(r=>`<li class="w${r.level}">${L==="ar"?r.ar:r.fr}</li>`).join("")}</ul>`;
    b.onclick=()=>{SEL=SEL===z.id?null:z.id;zonesList();draw();charts()};
    box.appendChild(b)});
}

function legend(){
  const g=$("#legend");
  if(LAYER==="true"){g.innerHTML=`<span>${t("lgTrue")}</span>`;return}
  if(LAYER==="chl"){const l=t("lgChl");g.innerHTML=`<span>${l[0]}</span><span class="ramp" style="background:linear-gradient(90deg,#2846a0,#3c96be,#78c896,#f0d250,#dc5a32,#961428)"></span><span>${l[2]}</span>`}
  else{const l=t("lgTurb");g.innerHTML=`<span>${l[0]}</span><span class="ramp" style="background:linear-gradient(90deg,#1e3c78,#468cb4,#bebe8c,#be8246,#784628)"></span><span>${l[1]}</span>`}
  if(document.dir==="rtl")g.querySelector(".ramp").style.transform="scaleX(-1)";
}

function draw(){
  const cv=$("#cv"),box=$("#map"),r=box.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);const W=r.width,H=r.height;
  c.fillStyle="#0b2226";c.fillRect(0,0,W,H);
  const [la0,la1,lo0,lo1]=DATA.box;
  const X=lo=>(lo-lo0)/(lo1-lo0)*W,Y=la=>(la1-la)/(la1-la0)*H;
  if(imgs.true){c.globalAlpha=LAYER==="true"?1:.55;c.drawImage(imgs.true,0,0,W,H);c.globalAlpha=1}
  if(LAYER!=="true"&&imgs[LAYER])c.drawImage(imgs[LAYER],0,0,W,H);
  if(!imgs.true){c.fillStyle="#cfe3e4";c.font="14px sans-serif";c.textAlign="center";c.fillText(t("noimg"),W/2,H/2)}
  const kmPx=W/((lo1-lo0)*111*Math.cos(23.76*Math.PI/180));
  DATA.zones.forEach(z=>{
    const x=X(z.lon),y=Y(z.lat),rr=DATA.zone_km*kmPx,col=getComputedStyle(document.documentElement).getPropertyValue(["--ok","--warn","--bad"][z.level]).trim();
    c.beginPath();c.arc(x,y,rr,0,7);c.lineWidth=SEL===z.id?3:2;c.strokeStyle=col;c.setLineDash(z.approx?[5,4]:[]);c.stroke();c.setLineDash([]);
    c.beginPath();c.arc(x,y,4,0,7);c.fillStyle=col;c.fill();
    c.font="600 13px 'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif";c.textAlign="center";
    const label=zname(z),tw=c.measureText(label).width+12;
    c.fillStyle="rgba(10,30,34,.78)";c.beginPath();c.roundRect?c.roundRect(x-tw/2,y-rr-24,tw,20,6):c.rect(x-tw/2,y-rr-24,tw,20);c.fill();
    c.fillStyle="#fff";c.fillText(label,x,y-rr-9)});
  // scale bar + north
  const sb=5*kmPx,x0=document.dir==="rtl"?W-16-sb:16,y0=H-18;
  c.strokeStyle="#fff";c.lineWidth=2;c.beginPath();c.moveTo(x0,y0);c.lineTo(x0+sb,y0);c.stroke();
  c.fillStyle="#fff";c.font="11px 'IBM Plex Sans',sans-serif";c.textAlign="center";c.fillText("5 km",x0+sb/2,y0-6);
  const nx=document.dir==="rtl"?22:W-22;c.beginPath();c.moveTo(nx,14);c.lineTo(nx-6,30);c.lineTo(nx+6,30);c.closePath();c.fill();c.fillText("N",nx,44);
}

function line(svg,days,series,unit,opts={}){
  const el=$(svg),W=el.clientWidth||600,H=el.clientHeight||150,p={l:34,r:10,t:10,b:20};
  const sel=SEL?DATA.zones.filter(z=>z.id===SEL):DATA.zones;
  const all=sel.flatMap(z=>z[series]).filter(v=>v!=null);
  if(!all.length||!days.length){el.innerHTML=`<text x="50%" y="50%" text-anchor="middle" fill="var(--mute)" font-size="12">–</text>`;return}
  let lo=Math.min(...all),hi=Math.max(...all);if(opts.zero)lo=0;const pad=(hi-lo)*.12||1;lo-=opts.zero?0:pad;hi+=pad;
  const n=days.length,X=i=>p.l+i*(W-p.l-p.r)/Math.max(1,n-1),Y=v=>p.t+(hi-v)/(hi-lo)*(H-p.t-p.b);
  const rtl=document.dir==="rtl",FX=i=>X(i);
  let s=`<g font-size="10" fill="var(--mute)" font-family="IBM Plex Sans">`;
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3,y=Y(v);s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--rule)"/><text x="4" y="${y+3}" text-anchor="start">${v.toFixed(v<10?1:0)}</text>`}
  [0,Math.floor(n/2),n-1].forEach((i,k)=>s+=`<text x="${FX(i)}" y="${H-4}" text-anchor="${["start","middle","end"][k]}">${days[i].slice(5)}</text>`);
  s+="</g>";
  if(opts.th)opts.th.forEach(([v,col])=>{if(v>lo&&v<hi)s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col}" stroke-dasharray="4 4" opacity=".8"/>`});
  const pal=["#145a63","#8a6fb0","#c08a1e","#2f8a5b","#b4442f"];
  sel.forEach((z,zi)=>{const vals=z[series];let d="",pen=false;vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+FX(i).toFixed(1)+","+Y(v).toFixed(1);pen=true});
    const col=SEL?"var(--lagoon)":pal[DATA.zones.indexOf(z)%pal.length];
    s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${SEL?2.5:1.6}" stroke-linejoin="round"/>`;
    const li=vals.length-1-[...vals].reverse().findIndex(v=>v!=null);if(li<vals.length&&vals[li]!=null)s+=`<circle cx="${FX(li)}" cy="${Y(vals[li])}" r="3" fill="${col}"/>`});
  el.innerHTML=s;
}
function charts(){
  const z=SEL&&DATA.zones.find(z=>z.id===SEL);$("#t-trend-z").textContent=z?zname(z):(L==="ar"?"كل المناطق":"Toutes les zones");
  line("#ch-sst",DATA.sst_days,"sst_series","°",{th:[[DATA.limits.sst_warm,"var(--warn)"],[DATA.limits.sst_hot,"var(--bad)"]]});
  line("#ch-chl",DATA.chl_days,"chl_series","",{zero:true,th:[[DATA.limits.chl_high,"var(--warn)"]]});
}
function windChart(){
  const el=$("#ch-wind"),w=DATA.wind;if(!w){el.innerHTML="";return}
  const W=el.clientWidth||600,H=el.clientHeight||110,n=w.speed.length,mx=Math.max(30,...w.speed.filter(v=>v!=null)),bw=(W-20)/n,rtl=document.dir==="rtl";
  let s="";w.speed.forEach((v,i)=>{if(v==null)return;const h=(v/mx)*(H-24),x=10+i*bw;
    s+=`<rect x="${x+.5}" y="${H-16-h}" width="${Math.max(1,bw-1)}" height="${h}" fill="${v>=DATA.limits.wind_work_kn?"var(--bad)":v>=18?"var(--warn)":"var(--lagoon-2)"}" rx="1"/>`});
  const y=H-16-(DATA.limits.wind_work_kn/mx)*(H-24);
  s+=`<line x1="10" x2="${W-10}" y1="${y}" y2="${y}" stroke="var(--bad)" stroke-dasharray="4 4"/><text x="${W-12}" y="${y-4}" font-size="10" fill="var(--bad)" text-anchor="end">${t("work")} · ${DATA.limits.wind_work_kn} kn</text>`;
  s+=`<text x="10" y="${H-3}" font-size="10" fill="var(--mute)">${w.t0.replace("T"," ")}</text><text x="${W-10}" y="${H-3}" font-size="10" fill="var(--mute)" text-anchor="end">+48 h</text>`;
  el.innerHTML=s;
}

document.querySelectorAll(".tools button").forEach(b=>b.onclick=()=>lang(b.dataset.l));
document.querySelectorAll("#layers button").forEach(b=>b.onclick=()=>{LAYER=b.dataset.k;render()});
$("#copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#msg").textContent);$("#copy").textContent=t("copied");setTimeout(()=>$("#copy").textContent=t("copy"),1500)}catch(e){}};
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{draw();charts();windChart()},120)});

(async()=>{
  if(!DATA){document.body.innerHTML="<p style='padding:20px'>No data yet.</p>";return}
  if(DATA.s2&&DATA.s2.size){document.querySelector("#map").style.setProperty("--ar",(DATA.s2.size[0]/DATA.s2.size[1]).toFixed(3))}
  else{const[a0,a1,o0,o1]=DATA.box;document.querySelector("#map").style.setProperty("--ar",((o1-o0)*Math.cos(23.76*Math.PI/180)/(a1-a0)).toFixed(3))}
  lang(L);
  if(DATA.s2){await Promise.all([loadImg("true","s2_true.jpg"),loadImg("chl","s2_chl.png"),loadImg("turb","s2_turb.png")]);draw()}
})();
</script>
</body>
