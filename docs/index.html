<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Dakhla Fish Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: offshore fishing console for pelagic vessels. Header (brand, day tabs: today + 3-day outlook, data LEDs, language,
   link to the coastal radar), satellite map viewport with radar sweep from Dakhla port, zone column (A-E cards, why-this-spot,
   vessel fuel), conditions strip (sea level + wind 30 h, compass, sea).
   One dark console look by design, matching the Negjir Bridge Console. */
:root{
  --void:#020a12; --glass:rgba(8,34,56,.62); --glass2:rgba(6,24,40,.82); --edge:rgba(80,220,255,.26); --edge2:rgba(80,220,255,.62);
  --ink:#e6f6ff; --mute:#86a9bf; --dim:#4f7189; --cyan:#4fe6ff; --green:#5dffa8; --amber:#ffb547; --coral:#ff6b4a; --sand:#2c2618; --sand2:#e6d2aa;
  --tech:"Chakra Petch","Readex Pro",system-ui,sans-serif; --ar:"Readex Pro",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark; background:var(--void);
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--tech);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.con{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;
  padding:10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 80% at 50% 0%,#0a2a44 0%,#04111e 55%,#020a12 100%)}
.con[dir="rtl"]{font-family:var(--ar)}
@media (min-width:901px){html,body{overflow:hidden}.con{height:100%}}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:10px;box-shadow:inset 0 0 24px rgba(79,230,255,.06);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);min-width:0}
.num{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:600 10.5px var(--tech);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
[dir="rtl"] .lbl{letter-spacing:0;font-family:var(--ar);font-size:12px}

/* header */
.hd{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:6px 10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;direction:ltr;flex:none}
.logo b{font:700 16px var(--tech);letter-spacing:.04em;white-space:nowrap}
.logo small{display:block;font:500 10px var(--mono);color:var(--mute);letter-spacing:.08em}
.pts{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.pts::-webkit-scrollbar{display:none}
.pt{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--edge);background:rgba(6,24,40,.5);border-radius:9px;padding:7px 12px;cursor:pointer;min-height:40px}
.pt[aria-selected="true"]{border-color:var(--edge2);background:rgba(79,230,255,.12);box-shadow:0 0 16px rgba(79,230,255,.2) inset}
.pt b{font-weight:600;font-size:14px;white-space:nowrap}
.pt span{font:500 11px var(--mono);color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim);box-shadow:0 0 8px currentColor}
.c-high{color:var(--green)}.c-medium{color:var(--amber)}.c-low{color:var(--mute)}
.dot.c-high{background:var(--green)}.dot.c-medium{background:var(--amber)}.dot.c-low{background:var(--mute)}
.leds{display:flex;gap:12px;font:500 11px var(--mono);color:var(--mute);direction:ltr;flex-wrap:wrap}
.leds i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);margin-right:5px;vertical-align:1px}
.leds i.w{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.langs{display:inline-flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden;direction:ltr;flex:none}
.langs button{border:0;background:none;padding:7px 10px;font:600 12px var(--tech);color:var(--mute);cursor:pointer;min-height:34px}
.langs button[aria-pressed="true"]{background:rgba(79,230,255,.16);color:var(--ink)}
.xlink{flex:none;border:1px solid var(--edge2);border-radius:8px;padding:7px 11px;font-weight:600;font-size:12.5px;color:var(--cyan);text-decoration:none;white-space:nowrap}
.xlink:hover{background:rgba(79,230,255,.12)}
.demo{font:700 11px var(--mono);color:#1a1000;background:var(--amber);border-radius:5px;padding:3px 7px;letter-spacing:.08em;direction:ltr}

/* map */
.mapbox{position:relative;overflow:hidden;min-height:340px;padding:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:absolute;pointer-events:none;font:500 11px var(--mono);color:var(--mute);direction:ltr}
.hud.tl{top:10px;left:10px;display:grid;gap:3px}
.hud.tl b{color:var(--ink);font:600 13px var(--tech);letter-spacing:.06em}
.hud.br{bottom:10px;right:10px;text-align:right;background:var(--glass2);border:1px solid var(--edge);border-radius:8px;padding:6px 9px;min-width:150px}
.hud.br b{color:var(--cyan)}
.layers{position:absolute;top:10px;right:10px;display:flex;gap:4px;direction:ltr;background:var(--glass2);border:1px solid var(--edge);border-radius:9px;padding:3px}
.layers button{border:0;background:none;border-radius:6px;padding:6px 10px;font:600 11.5px var(--tech);letter-spacing:.06em;color:var(--mute);cursor:pointer;min-height:32px}
.layers button[aria-pressed="true"]{background:rgba(79,230,255,.16);color:var(--ink)}
.legend{position:absolute;bottom:10px;left:10px;direction:ltr;display:grid;gap:4px;font:500 10.5px var(--mono);color:var(--mute);background:var(--glass2);border:1px solid var(--edge);border-radius:8px;padding:7px 9px}
.legend canvas{width:150px;height:8px;border-radius:3px;display:block}
.legend div{display:flex;justify-content:space-between}
.reset{position:absolute;top:52px;right:10px;border:1px solid var(--edge);background:var(--glass2);border-radius:8px;padding:5px 9px;font:600 11px var(--tech);color:var(--mute);cursor:pointer;direction:ltr}

/* zone column */
.side{grid-row:2/4;grid-column:2;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;scrollbar-width:thin}
.sec{padding:10px 12px;display:grid;gap:8px}
.sec h2{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.zone{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:9px 10px;border:1px solid var(--edge);border-radius:9px;background:rgba(4,17,30,.55);cursor:pointer;text-align:start;width:100%}
.zone[aria-pressed="true"]{border-color:var(--edge2);background:rgba(79,230,255,.09);box-shadow:0 0 18px rgba(79,230,255,.14) inset}
.zid{grid-row:1/3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--tech);border:2px solid currentColor;background:var(--void)}
.zpos{font:600 13px var(--mono);direction:ltr;unicode-bidi:isolate;text-align:start}
[dir="rtl"] .zpos{text-align:right}
.zsub{grid-column:2/4;font-size:12.5px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.zsub b{color:var(--ink);font-weight:600}
.pill{font:600 10.5px var(--tech);letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:2px 8px;white-space:nowrap}
[dir="rtl"] .pill{letter-spacing:0;font-family:var(--ar);font-size:11.5px}
.why{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:118px 1fr 38px;gap:8px;align-items:center;font-size:12.5px}
.bar .t{height:7px;border-radius:4px;background:rgba(79,230,255,.1);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .6s ease}
[dir="rtl"] .bar .t i{background:linear-gradient(270deg,var(--cyan),var(--green))}
.bar .v{font:600 12px var(--mono);text-align:end;direction:ltr}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fact{border:1px solid var(--edge);border-radius:8px;padding:7px 8px;display:grid;gap:2px;min-width:0}
.fact b{font:600 16px var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact b small{font-size:11px;color:var(--mute);font-weight:500}
.boat{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mute)}
.boat label{display:flex;align-items:center;gap:6px}
.boat input{width:58px;background:rgba(4,17,30,.7);border:1px solid var(--edge);border-radius:6px;padding:5px 6px;font:600 13px var(--mono);direction:ltr;text-align:center}
.copy{border:0;border-radius:9px;background:var(--cyan);color:#021018;font-weight:700;padding:11px 14px;cursor:pointer;font-size:14px;min-height:42px}
.copy.ok{background:var(--green)}
#msgfb{width:100%;min-height:150px;background:rgba(4,17,30,.7);border:1px solid var(--edge);border-radius:8px;color:var(--ink);font:13px/1.6 var(--ar);padding:8px}
.crow{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(80,220,255,.12)}
.crow b{font:600 13px var(--mono);direction:ltr;unicode-bidi:isolate;text-align:start;overflow-wrap:anywhere}
[dir="rtl"] .crow b{text-align:right}
.cbtn{border:1px solid var(--edge);background:rgba(4,17,30,.7);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;min-height:32px}
.cbtn.ok{border-color:var(--green);color:var(--green)}
.navbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.nbtn{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--edge2);background:rgba(79,230,255,.1);color:var(--cyan);border-radius:9px;padding:10px;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;min-height:42px;text-align:center}
.nbtn.ok{border-color:var(--green);color:var(--green)}
.note{font-size:11.5px;line-height:1.6;color:var(--mute);margin:0}

/* conditions */
.cond{grid-column:1;display:grid;grid-template-columns:minmax(0,1fr) 150px 190px;gap:8px}
.tide{position:relative;padding:8px 10px 6px;min-height:150px}
#tide{width:100%;height:118px;display:block}
.compass{padding:8px;display:grid;place-items:center;gap:2px}
.compass svg{width:104px;height:104px}
.sea{padding:10px 12px;display:grid;gap:8px;align-content:start}
.gauge{display:grid;gap:4px}
.gauge .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.gauge .row b{font:600 15px var(--mono);direction:ltr}
.gauge .t{height:6px;border-radius:3px;background:rgba(79,230,255,.1);overflow:hidden}
.gauge .t i{display:block;height:100%;background:var(--cyan);border-radius:3px}

/* boot */
.boot{position:fixed;inset:0;z-index:20;background:radial-gradient(80% 60% at 50% 40%,#082238,#020a12);display:grid;place-items:center;transition:opacity .5s ease}
.boot.off{opacity:0;pointer-events:none}
.boot .in{width:min(420px,88vw);display:grid;gap:10px;direction:ltr;font:500 12.5px var(--mono);color:var(--mute)}
.boot h1{margin:0 0 6px;font:700 22px var(--tech);color:var(--ink);letter-spacing:.06em}
.boot .ln{display:flex;justify-content:space-between;gap:10px;opacity:0;transform:translateY(4px);transition:.3s}
.boot .ln.on{opacity:1;transform:none}
.boot .ln b{color:var(--green)}
.boot .ln b.w{color:var(--amber)}
.boot .pb{height:3px;background:rgba(79,230,255,.12);border-radius:2px;overflow:hidden}
.boot .pb i{display:block;height:100%;width:0;background:var(--cyan);transition:width 1.4s linear}
.empty{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:var(--mute)}

@media (max-width:900px){
  .con{grid-template-columns:minmax(0,1fr);grid-template-rows:none;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .side{grid-row:auto;grid-column:1;overflow:visible}
  .mapbox{height:64vh;min-height:360px}
  .cond{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tide{grid-column:1/-1}
  .hd{gap:8px}.pts{order:5;flex-basis:100%}
  .hud.br{min-width:0}
}
@media (max-width:900px){.hud.tl{top:52px}.reset{top:52px}}
@media (max-width:420px){.bar{grid-template-columns:96px 1fr 34px}.legend canvas{width:110px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <h1>DAKHLA FISH RADAR</h1>
  <div class="pb"><i id="pb"></i></div>

</div></div>

      <button class="copy" id="copy" type="button"></button>

  </aside>

  <section class="cond">

  </section>
</div>

/* ---------- color ramps ---------- */

/* ---------- raster ---------- */
let img;
function raster(){

  for(let i=0;i<G.n*G.m;i++){const o=i*4,land=isNaN(G.sst[i]);
    if(land){d.data[o]=44;d.data[o+1]=38;d.data[o+2]=24;d.data[o+3]=255;continue}
    const v=a?a[i]:NaN;
    if(isNaN(v)){d.data[o]=16;d.data[o+1]=30;d.data[o+2]=44;d.data[o+3]=255;continue}
    const c3=rp(nf(v));d.data[o]=c3[0];d.data[o+1]=c3[1];d.data[o+2]=c3[2];d.data[o+3]=255}
  x.putImageData(d,0,0);img=c;
  // legend
  const lg=$("#lg").getContext("2d");for(let i=0;i<150;i++){const c3=rp(i/149);lg.fillStyle=`rgb(${c3.map(Math.round)})`;lg.fillRect(i,0,1,8)}
  $("#lgt").textContent=layer==="score"?t("score"):layer==="sst"?t("sstl"):layer==="depth"?t("depthl"):t("chll");

  else if(layer==="depth"){$("#lg0").textContent="0 m";$("#lg1").textContent=Math.round(hi)+" m"}
  else if(layer==="sst"){$("#lg0").textContent=lo.toFixed(1)+"°";$("#lg1").textContent=hi.toFixed(1)+"°"}
  else{$("#lg0").textContent=a?(10**lo).toFixed(2):"—";$("#lg1").textContent=a?(10**hi).toFixed(1):"—"}
}

/* ---------- marching squares (segments, grid-index space) ---------- */
function iso(a,n,m,lev){
  const seg=[];

    const v0=a[r*m+c],v1=a[r*m+c+1],v2=a[(r+1)*m+c+1],v3=a[(r+1)*m+c];
    if(isNaN(v0)||isNaN(v1)||isNaN(v2)||isNaN(v3))continue;
    const k=(v0>lev)|(v1>lev)<<1|(v2>lev)<<2|(v3>lev)<<3;if(k===0||k===15)continue;

    const T2={1:[[0,3]],2:[[0,1]],3:[[1,3]],4:[[1,2]],5:[[0,1],[2,3]],6:[[0,2]],7:[[2,3]],8:[[2,3]],9:[[0,2]],10:[[0,3],[1,2]],11:[[1,2]],12:[[1,3]],13:[[0,1]],14:[[0,3]]}[k];
    for(const[i,j]of T2)seg.push(e[i][0],e[i][1],e[j][0],e[j][1]);

  const o=new Float32Array(G.n*G.m);for(let i=0;i<o.length;i++)o[i]=isNaN(G.sst[i])?0:1;

/* ---------- view ---------- */
const cv=$("#map"),cx=cv.getContext("2d");let W=0,H=0,DPR=1,view={s:1,x:0,y:0};
function fit(){const ww=G.m*G.cos,hh=G.n,s=Math.min(W/ww,H/hh)*1.0;view={s,x:(W-ww*s)/2,y:(H-hh*s)/2}}
const sx=c=>view.x+(c*G.cos)*view.s, sy=r=>view.y+r*view.s;   // grid index -> screen (cell centre = index+.5)
const fromS=(X,Y)=>[((X-view.x)/view.s)/G.cos,(Y-view.y)/view.s];
function size(){const r=cv.getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;if(G)fit()}

/* ---------- draw ---------- */
let t0=performance.now(),pings=[];

  cx.direction="ltr";cx.fillStyle="#04111e";cx.fillRect(0,0,W,H);

  const seg=(s,off=.5)=>{cx.beginPath();for(let i=0;i<s.length;i+=4){cx.moveTo(sx(s[i]+off),sy(s[i+1]+off));cx.lineTo(sx(s[i+2]+off),sy(s[i+3]+off))}cx.stroke()};

      if(lx<40||ly<40||lx>W-40||ly>H-40)continue;if(placed.every(([px,py])=>Math.hypot(px-lx,py-ly)>80)){best=[lx,ly];break}}
    if(!best)continue;placed.push(best);const[lx,ly]=best;
    const lab=o.l+" m",w=cx.measureText(lab).width+8;cx.fillStyle="rgba(2,10,18,.75)";cx.fillRect(lx-w/2,ly-7,w,14);cx.fillStyle=layer==="depth"?"#e6f6ff":"#9fd3ff";cx.fillText(lab,lx,ly)}

    if(!RM){const prev=((ang-z.brg+360)%360);if(prev<4&&!pings.some(q=>q.i===i&&tm-q.t<1))pings.push({i,t:tm})}

  cx.font="700 13px Chakra Petch, Readex Pro, sans-serif";cx.fillStyle="#4fe6ff";cx.textAlign="center";cx.textBaseline="top";cx.fillStyle="rgba(2,10,18,.7)";const nw=cx.measureText(NAME[L](p)).width+10;cx.fillRect(X0-nw/2,Y0+12,nw,18);cx.fillStyle="#4fe6ff";cx.fillText(NAME[L](p),X0,Y0+14);
  // north arrow + scale
  cx.save();cx.translate(W-28,96);cx.fillStyle="rgba(230,246,255,.85)";cx.beginPath();cx.moveTo(0,-14);cx.lineTo(6,6);cx.lineTo(0,2);cx.lineTo(-6,6);cx.closePath();cx.fill();
  cx.font="600 10px Chakra Petch, sans-serif";cx.textAlign="center";cx.fillText("N",0,18);cx.restore();
  const sk=20*nmPx;cx.fillStyle="#e6f6ff";cx.fillRect(14,H-74,sk,3);cx.font="10px JetBrains Mono, monospace";cx.textAlign="left";cx.fillText("20 nm",14,H-82);
  requestAnimationFrame(frame);
}

/* ---------- interaction: pan, zoom, pick, readout ---------- */
const ptrs=new Map();let pinch=null,moved=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});moved=0;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s,vx:view.x,vy:view.y,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}});
cv.addEventListener("pointermove",e=>{const q=ptrs.get(e.pointerId);readout(e.offsetX,e.offsetY);if(!q)return;
  const dx=e.offsetX-q.x,dy=e.offsetY-q.y;q.x=e.offsetX;q.y=e.offsetY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===2&&pinch){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),k=Math.min(8,Math.max(.6,d/pinch.d))*pinch.s/view.s;zoomAt(pinch.mx,pinch.my,k)}
  else if(ptrs.size===1){view.x+=dx;view.y+=dy}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(moved<6&&e.type==="pointerup")pick(e.offsetX,e.offsetY)};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*.0015))},{passive:false});
function zoomAt(X,Y,k){const s0=fitScale(),ns=Math.min(s0*8,Math.max(s0*.8,view.s*k));k=ns/view.s;view.x=X-(X-view.x)*k;view.y=Y-(Y-view.y)*k;view.s=ns}
function fitScale(){return Math.min(W/(G.m*G.cos),H/G.n)}
$("#reset").onclick=()=>fit();
function pick(X,Y){let b=-1,bd=30;P.zones.forEach((z,i)=>{const d=Math.hypot(sx(gx(G,z.lon)+.5)-X,sy(gy(G,z.lat)+.5)-Y);if(d<bd){bd=d;b=i}});if(b>=0){ZI=b;side()}}
function readout(X,Y){const[c,r]=fromS(X,Y),ci=Math.round(c-.5),ri=Math.round(r-.5);const el=$("#read");
  if(ci<0||ri<0||ci>=G.m||ri>=G.n){el.textContent="—";return}
  const i=ri*G.m+ci,lat=G.lat0-ri*G.cell,lon=G.lon0+ci*G.cell;
  if(isNaN(G.sst[i])){el.innerHTML=`${dm(lat,"N","S",2)} ${dm(lon,"E","W",3)}<br>LAND`;return}
  const ch=G.chl&&!isNaN(G.chl[i])?(10**G.chl[i]).toFixed(2)+" mg/m³":"—";
  const dp=G.depth&&!isNaN(G.depth[i])?Math.round(G.depth[i])+" m":"—";
  el.innerHTML=`${dm(lat,"N","S",2)} ${dm(lon,"E","W",3)}<br>SST <b>${G.sst[i].toFixed(1)}°C</b> · CHL <b>${ch}</b><br>DEPTH <b>${dp}</b> · SCORE <b>${Math.round(G.score[i]*100)}</b>`}

/* ---------- side panel ---------- */
function side(){
  const Z=P.zones,box=$("#zones");box.innerHTML="";
  if(!Z.length){box.innerHTML=`<p class="note">${t("none")}</p>`}
  Z.forEach((z,i)=>{const tr=trip(z),b=document.createElement("button");b.className="zone";b.type="button";b.setAttribute("aria-pressed",i===ZI);
    b.innerHTML=`<span class="zid c-${z.conf}">${z.id}</span><span class="zpos">${pos(z)}</span><span class="pill c-${z.conf}"><span class="num">${z.pct}%</span></span>
    <span class="zsub"><span><b class="num">${z.km}</b> ${t("km")} ${comp(z.brg)} <span class="num">(${z.brg}°)</span></span>${z.depth_m?`<span>${t("depth")} <b class="num">${z.depth_m} m</b></span>`:""}<span>${t("eta")} <b class="num">${hm(tr.min)}</b></span><span>${t("fuel")} <b class="num">${tr.fuel.toLocaleString("en-US")} L</b></span></span>`;
    b.onclick=()=>{ZI=i;side()};box.appendChild(b)});
  const z=Z[ZI];$("#whyz").textContent=z?`${t("zone")} ${z.id}`:"";
  const f=z?z.f||{}:{},row=(k,v)=>`<div class="bar"><span>${t(k)}</span><span class="t"><i style="width:${v==null?0:Math.round(v*100)}%"></i></span><span class="v">${v==null?"—":Math.round(v*100)}</span></div>`;
  $("#why").innerHTML=P.tab==="fc"?`<p class="note">${t("fcnote")}</p>`:z?row("front",f.front)+row("chl",f.chl)+(f.chl==null?`<p class="note">${t("nochl")}</p>`:""):"";
  const tr=z?trip(z):null;
  $("#facts").innerHTML=z?`<div class="fact"><span class="lbl">${t("sst")}</span><b>${z.sst??"—"}<small>°C</small></b></div>
   <div class="fact"><span class="lbl">${t("chlv")}</span><b>${z.chl_mg??"—"}<small> mg</small></b></div>
   <div class="fact"><span class="lbl">${t("fuel")}</span><b>${tr.fuel.toLocaleString("en-US")}<small> L</small></b><span class="lbl" style="letter-spacing:0;text-transform:none">${t("rt")}</span></div>`:"";
  $("#copy").textContent=t("copy");
  navPanel();
}
/* ---------- navigation: coordinates in 3 formats, GPX, open in app ---------- */
function dms(v,p,n,w){let a=Math.abs(v),d=Math.floor(a),mf=(a-d)*60,m=Math.floor(mf),s=Math.round((mf-m)*60);if(s===60){s=0;m++}if(m===60){m=0;d++}
  return String(d).padStart(w,"0")+"°"+String(m).padStart(2,"0")+"'"+String(s).padStart(2,"0")+'"'+(v>=0?p:n)}
function copyText(v,btn,okTxt,back){const ok=()=>{btn.textContent=okTxt;btn.classList.add("ok");setTimeout(()=>{btn.textContent=back;btn.classList.remove("ok")},1400)};
  const fb=()=>{const ta=$("#msgfb");ta.hidden=false;ta.value=v;ta.focus();ta.select()};try{navigator.clipboard.writeText(v).then(ok,fb)}catch(e){fb()}}
function gpxFile(){
  const P0=P.point,day=(P.date||DATA.day||"").slice(5).replace("-",""),tag="DFR",esc=x=>String(x).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
  const w=(la,lo,nm,ds)=>`<wpt lat="${la.toFixed(5)}" lon="${lo.toFixed(5)}"><name>${esc(nm)}</name><desc>${esc(ds)}</desc><sym>Fishing Area</sym></wpt>`;
  const body=w(P0.lat,P0.lon,tag+"-PORT",P0.fr||"")+P.zones.map(z=>w(z.lat,z.lon,tag+"-"+z.id+day,`${z.km} nm ${z.brg}deg ${z.pct!=null?z.pct+"%":z.conf}${z.depth_m?" depth "+z.depth_m+"m":""} ${P.date||DATA.day}`)).join("");
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Dakhla Fish Radar" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>${esc(tag+" "+(P.date||DATA.day))}</name></metadata>${body}</gpx>`}
function navPanel(){
  const z=P.zones[ZI],box=$("#nav");if(!z){box.innerHTML="";$("#navz").textContent="";return}
  $("#navz").textContent=`${t("zone")} ${z.id}`;
  const rows=[["DDM",pos(z)],["DD",z.lat.toFixed(4)+", "+z.lon.toFixed(4)],["DMS",dms(z.lat,"N","S",2)+" "+dms(z.lon,"E","W",3)]];
  box.innerHTML=rows.map(([k,v],i)=>`<div class="crow"><span class="lbl">${k}</span><b>${v}</b><button class="cbtn" type="button" data-i="${i}">${t("copyc")}</button></div>`).join("")+
    `<div class="navbtns"><button class="nbtn" type="button" id="gpxb">⬇ ${t("gpx")}</button><a class="nbtn" href="geo:${z.lat},${z.lon}?q=${z.lat},${z.lon}(${encodeURIComponent("Zone "+z.id)})">${t("openapp")}</a></div><p class="note">${t("navnote")}</p>`;
  box.querySelectorAll(".cbtn").forEach(b=>b.onclick=()=>copyText(rows[+b.dataset.i][1],b,t("copiedc"),t("copyc")));
  $("#gpxb").onclick=function(){const b=this;try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([gpxFile()],{type:"application/gpx+xml"}));
    a.download=`dakhla-${"radar"}-${P.date||DATA.day}.gpx`;document.body.appendChild(a);a.click();a.remove();b.textContent="✓ "+t("gpxok");setTimeout(()=>b.textContent="⬇ "+t("gpx"),1600)}catch(e){copyText(gpxFile(),b,t("copiedc"),"⬇ "+t("gpx"))}};
}

/* ---------- conditions ---------- */
function conditions(){
  const c=P.conditions||{},s=c.series||{};
  // tide + wind chart
  const tc=$("#tide"),r=tc.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);tc.width=r.width*d;tc.height=r.height*d;const x=tc.getContext("2d");x.setTransform(d,0,0,d,0,0);x.direction="ltr";
  const w=r.width,h=r.height,sea=(s.sea||[]).map(v=>v??NaN),wind=(s.wind||[]).map(v=>v??NaN),N=Math.max(sea.length,wind.length,24);
  const pl=38,pr=8,top=14,mid=h*.56,bot=h-16,X=i=>pl+(w-pl-pr)*i/(N-1);
  x.font="10px JetBrains Mono, monospace";x.fillStyle="#86a9bf";x.strokeStyle="rgba(140,200,230,.1)";x.lineWidth=1;
  for(const hh of[0,6,12,18,24]){if(hh>=N)continue;const xx=X(hh);x.beginPath();x.moveTo(xx,top);x.lineTo(xx,bot);x.stroke();x.textAlign="center";x.fillText(String(hh%24).padStart(2,"0")+":00",xx,h-3)}
  const sv=sea.filter(v=>!isNaN(v));
  if(sv.length){const lo=Math.min(...sv),hi=Math.max(...sv),Y=v=>mid-(v-lo)/((hi-lo)||1)*(mid-top-6);
    x.textAlign="right";x.fillText(hi.toFixed(1)+"m",pl-4,Y(hi)+3);x.fillText(lo.toFixed(1)+"m",pl-4,Y(lo)+3);
    const gr=x.createLinearGradient(0,top,0,mid);gr.addColorStop(0,"rgba(79,230,255,.35)");gr.addColorStop(1,"rgba(79,230,255,0)");
    x.beginPath();sea.forEach((v,i)=>{if(!isNaN(v))x.lineTo(X(i),Y(v))});x.lineTo(X(sea.length-1),mid);x.lineTo(X(0),mid);x.closePath();x.fillStyle=gr;x.fill();
    x.beginPath();sea.forEach((v,i)=>{if(!isNaN(v))x.lineTo(X(i),Y(v))});x.strokeStyle="#4fe6ff";x.lineWidth=2;x.stroke();
    for(let i=1;i<sea.length-1;i++){const a=sea[i-1],b=sea[i],c2=sea[i+1];if([a,b,c2].some(isNaN))continue;const hiP=b>a&&b>=c2,loP=b<a&&b<=c2;if(!hiP&&!loP)continue;
      x.fillStyle=hiP?"#e6f6ff":"#86a9bf";x.beginPath();x.arc(X(i),Y(b),3,0,7);x.fill();x.textAlign="center";x.fillText(String(i%24).padStart(2,"0")+":00",X(i),hiP?Y(b)-6:Y(b)+13)}}
  const wv=wind.filter(v=>!isNaN(v));
  if(wv.length){const mx=Math.max(25,...wv),bw=(w-pl-pr)/N*.6;
    wind.forEach((v,i)=>{if(isNaN(v))return;const hh=(v/mx)*(bot-mid-20);x.fillStyle=v>20?"#ff6b4a":v>14?"#ffb547":"rgba(93,255,168,.75)";x.fillRect(X(i)-bw/2,bot-hh,bw,hh)});
    x.fillStyle="#86a9bf";x.textAlign="right";x.fillText(Math.round(Math.max(...wv))+"kn",pl-4,bot-2)}
  // now marker
  const now=new Date(),today=now.toISOString().slice(0,10);
  if(s.t0&&s.t0.slice(0,10)===today){const hh=now.getHours()+now.getMinutes()/60;if(hh<N){x.strokeStyle="#ffb547";x.setLineDash([3,3]);x.beginPath();x.moveTo(X(hh),top);x.lineTo(X(hh),bot);x.stroke();x.setLineDash([]);x.fillStyle="#ffb547";x.textAlign="left";x.fillText(t("now"),X(hh)+3,top+8)}}
  // compass
  const dir=c.wind_dir,kn=c.wind_kn;let g='<circle r="52" fill="rgba(4,17,30,.6)" stroke="rgba(80,220,255,.3)"/>';
  for(let i=0;i<72;i++){const a=i*5*Math.PI/180,l=i%18===0?9:i%2?3:5;g+=`<line x1="${Math.sin(a)*50}" y1="${-Math.cos(a)*50}" x2="${Math.sin(a)*(50-l)}" y2="${-Math.cos(a)*(50-l)}" stroke="rgba(134,169,191,.7)" stroke-width="${i%18?0.8:1.6}"/>`}
  ["N","E","S","W"].forEach((k,i)=>{const a=i*Math.PI/2;g+=`<text x="${Math.sin(a)*34}" y="${-Math.cos(a)*34+4}" fill="${k==="N"?"#4fe6ff":"#86a9bf"}" font-size="11" font-family="Chakra Petch" text-anchor="middle">${k}</text>`});
  if(dir!=null){g+=`<g transform="rotate(${dir+180})"><path d="M0 -44 L7 -20 L2 -22 L2 30 L-2 30 L-2 -22 L-7 -20 Z" fill="#5dffa8"/></g>`}
  $("#cmp").innerHTML=g;$("#wkn").textContent=kn!=null?`${kn} kn · ${dir}°`:"—";
  // sea gauges
  const up=c.upwelling||0,upk=up>200?t("strong"):up>100?t("mod"):t("weak"),gau=(lab,val,frac,col)=>`<div class="gauge"><div class="row"><span class="lbl">${lab}</span><b>${val}</b></div><div class="t"><i style="width:${Math.round(Math.max(0,Math.min(1,frac))*100)}%;background:${col}"></i></div></div>`;
  const tides=(c.tides||[]).map(([k,tt])=>`${k==="high"?t("hi"):t("lo")} <span class="num">${tt.slice(11,16)}</span>`).join(" · ");
  $("#sea").innerHTML=gau(t("wave"),c.wave_max!=null?c.wave_max+" m":"—",(c.wave_max||0)/3,(c.wave_max||0)>2?"#ff6b4a":"#4fe6ff")+
    gau(t("up"),upk,up/300,"#5dffa8")+`<div class="gauge"><span class="lbl">${t("tides")}</span><span style="font-size:12.5px;line-height:1.6">${tides||"—"}</span></div>`;
}

/* ---------- message ---------- */
function message(){
  const Z=P.zones,I=x=>"\u2066"+x+"\u2069",lines=[`🐟 ${t("radar")} · ${tabName(P)} · ${I(P.date)}`,t("species"),""];
  if(!Z.length)lines.push(t("none"));
  Z.forEach(z=>{const tr=trip(z);lines.push(`${t("zone")} ${z.id}: ${I(pos(z))}`,`   ${I(z.km+" nm · "+z.brg+"°")} ${comp(z.brg)} · ${t("confp")} ${z.pct}% · ${t("fuel")} ~${I(tr.fuel.toLocaleString("en-US")+" L")}`)});
  const c=P.conditions||{};lines.push("");
  if(P.tab==="fc"&&DATA.forecast&&DATA.forecast.headline)lines.push(DATA.forecast.headline);
  if(P.tab==="today"&&c.wind_kn!=null)lines.push(`${t("wind")} ${I(c.wind_kn+" kn")} · ${t("wave")} ${I((c.wave_max??"—")+" m")}`);
  const src=Object.entries(DATA.sources||{}).map(([k,v])=>`${k} ${I(v)}`).join(" · ");if(src)lines.push(`${t("src")}: ${src}`);
  lines.push("",t("note"));return lines.join("\n");
}
$("#copy").onclick=function(){const m=message(),b=this;
  const ok=()=>{b.textContent=t("copied");b.classList.add("ok");setTimeout(()=>{b.textContent=t("copy");b.classList.remove("ok")},1600)};
  const fb=()=>{const ta=$("#msgfb");ta.hidden=false;ta.value=m;ta.focus();ta.select()};
  try{navigator.clipboard.writeText(m).then(ok,fb)}catch(e){fb()}};
["spd","lph"].forEach(id=>{const el=$("#"+id);try{const v=localStorage.getItem("rr_"+id);if(v)el.value=v}catch(e){}
  el.addEventListener("input",()=>{try{localStorage.setItem("rr_"+id,el.value)}catch(e){}if(P)side()})});

/* ---------- header / language ---------- */
function header(){

  DATA.points.forEach((q,i)=>{const z=q.zones[0],b=document.createElement("button");b.className="pt";b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",i===PI);

  $("#hpt").textContent=(t("radar")+" · "+tabName(P)).toUpperCase();$("#hday").textContent=`${P.date} · BUILT ${DATA.made||""}`;
  $("#hsrc").textContent="NASA MUR SST · Copernicus Marine · GEBCO · Open-Meteo";
  $("#species").textContent=t("species");$("#species").classList.toggle("num",false);$("#xlink").textContent=t("xlink");
}
function texts(){
  const con=$("#con");con.dir=L==="ar"?"rtl":"ltr";con.lang=L;document.documentElement.lang=L;
  [["#t-nav","nav"],["#t-zones","zones"],["#t-why","why"],["#t-boat","boat"],["#t-speed","speed"],["#t-cons","cons"],["#t-note","note"],["#t-tide","tide"],["#t-wind","wind"]].forEach(([s,k])=>$(s).textContent=t(k));

document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("rr_l",L)}catch(e){}texts();header();side();conditions();raster()});

/* ---------- boot ---------- */
function boot(){
  const b=$("#boot"),l=$("#bootl");
  if(!DATA){b.classList.add("off");$(".mapbox").innerHTML='<div class="empty">No data yet. Run radar.py to build today\'s map.</div>';return}

  l.innerHTML=rows.map(r=>`<div class="ln"><span>${r[0]}</span><b class="${r[2]}">${r[1]} ✓</b></div>`).join("");

addEventListener("resize",()=>{if(!G)return;size();conditions()});
boot();
</script>
