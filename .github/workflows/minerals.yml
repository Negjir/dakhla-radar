name: MADAR Minerals (proof on known mines)

on:
  push:
    branches: [main]
    paths: ["minerals_queue.txt", "minerals_dem.py", "minerals_struct.py"]
  workflow_dispatch:
    inputs:
      site:
        description: "imiter, bouazzer, kediet (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: minerals
  cancel-in-progress: false

jobs:
  minerals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install rasterio pystac-client numpy scipy pillow reportlab
      - name: Sentinel-2 analysis
        run: |
          SITE="${{ github.event.inputs.site }}"
          # on a push, the sites to (re)run are listed in minerals_queue.txt ("dem" = terrain only)
          if [ "${{ github.event_name }}" = "push" ]; then SITE="$(tr -d ' \n' < minerals_queue.txt)"; fi
          if [ "$SITE" = "list" ]; then python mrds_list.py; exit 0; fi
          if [ "$SITE" = "test" ]; then python minerals_test.py; exit 0; fi
          if [ "$SITE" != "dem" ]; then
            ARGS=""
            if [ -n "$SITE" ]; then ARGS="--site $SITE"; fi
            python minerals.py $ARGS
            python minerals_report.py
          fi
          python minerals_dem.py
          python minerals_struct.py
      - name: Save results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/minerals data
          git commit -m "Minerals $(date -u +%F-%H%M)" || echo "nothing to commit"
          git pull --rebase
          git push
