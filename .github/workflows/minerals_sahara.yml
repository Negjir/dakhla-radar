name: MADAR Minerals - Sahara regional scan

on:
  push:
    branches: [main]
    paths: ["minerals_region.py", "minerals_region_emit.py", "minerals_gold.py", "minerals_sahara.html", ".github/workflows/minerals_sahara.yml"]
  workflow_dispatch:
    inputs:
      page_only:
        description: "Only rebuild the page from the last results (true/false)"
        required: false
        default: "false"
      rescan:
        description: "Run the Sentinel-2 scan again (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: minerals
  cancel-in-progress: false

jobs:
  sahara:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install rasterio pystac-client numpy scipy pillow matplotlib earthaccess netCDF4 h5py
      - name: Restore the large grids from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: sahara-grids-${{ github.run_id }}
          restore-keys: sahara-grids-
      - name: Regional scan (Sentinel-2, ~100 m, then 10 m chips)
        run: |
          # the Sentinel-2 scan only runs when its own code changed (or on request); page and EMIT edits reuse it
          CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
          if [ "${{ github.event.inputs.page_only }}" = "true" ]; then python minerals_region.py --page-only
          elif [ "${{ github.event.inputs.rescan }}" = "true" ] || echo "$CHANGED" | grep -q "^minerals_region.py$" || [ ! -f docs/minerals/sahara/sahara.json ] || [ ! -f data/cache/sahara_s2.npz ]; then python -u minerals_region.py
          else echo "Sentinel-2 scan unchanged: kept"; fi
      - name: NASA EMIT over the Sahara and the gold model
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASS }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python -u minerals_region_emit.py 2>&1 | tee docs/minerals/sahara/emit_log.txt
      - name: Gold model (EMIT + Sentinel-2 + ASTER silica + faults)
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASS }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python -u minerals_gold.py 2>&1 | tee docs/minerals/sahara/gold_log.txt
      - name: Keep the large grids for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: sahara-grids-${{ github.run_id }}
      - name: Save results
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/minerals/sahara data
          git commit -m "Sahara scan $(date -u +%F-%H%M)" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
