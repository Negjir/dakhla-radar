name: Sea memory maps

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fronts
  cancel-in-progress: false

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "copernicusmarine>=2.0" xarray numpy scipy matplotlib netCDF4 arabic-reshaper python-bidi
      - uses: actions/cache@v4
        with:
          path: data/cache/mur_fronts
          key: mur-fronts-v1-${{ github.run_id }}
          restore-keys: mur-fronts-v1-
      - uses: actions/cache@v4
        with:
          path: data/cache/cmems_fronts
          key: cmems-fronts-v1-${{ github.run_id }}
          restore-keys: cmems-fronts-v1-
      - name: Analysis
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASS }}
        run: python tools/sea_memory_maps.py
      - name: Save results
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/analysis/fronts || true
          git commit -m "Sea memory maps $(date -u +%F-%H%M)" || echo "nothing to commit"
          git pull --rebase
          git push
